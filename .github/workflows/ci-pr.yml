name: PR CI

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

jobs:
  pr-ci:
    # Only run CI when PR comes *from sandbox branch*
    if: github.event.pull_request.head.ref == 'sandbox'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"

      - name: Verify dependencies
        run: go mod tidy

      - name: Build
        run: go build -v ./...
